<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FD0FF"/>
      <stop offset="0.55" stop-color="#2E9FD8"/>
      <stop offset="1" stop-color="#0B5A7A"/>
    </linearGradient>
    <linearGradient id="prize" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FE0FF"/>
      <stop offset="1" stop-color="#2E9FD8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Aufgefächertes Deck: die verdeckte Preiskarte in der Mitte -->
  <g>
    <rect x="150" y="150" width="150" height="212" rx="20" fill="#ffffff" opacity="0.55"
          transform="rotate(-18 225 256)"/>
    <rect x="212" y="150" width="150" height="212" rx="20" fill="#ffffff" opacity="0.7"
          transform="rotate(18 287 256)"/>
    <rect x="181" y="140" width="150" height="212" rx="20" fill="url(#prize)"
          stroke="#ffffff" stroke-width="8"/>
    <!-- Fragezeichen = unbekannte Preiskarte -->
    <text x="256" y="290" text-anchor="middle" font-family="Sora, system-ui, sans-serif"
          font-size="150" font-weight="800" fill="#ffffff">?</text>
  </g>
  <!-- Stern-Badge = wertvoll / prized -->
  <g transform="translate(372 372)">
    <circle r="60" fill="#ffffff"/>
    <path d="M0 -34 L10 -11 L35 -11 L15 5 L22 30 L0 15 L-22 30 L-15 5 L-35 -11 L-10 -11 Z"
          fill="#2E9FD8"/>
  </g>
</svg>
